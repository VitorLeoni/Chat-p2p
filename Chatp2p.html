<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat P2P</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --text:#1c1c1a; --muted:#6b6b66; --accent:#2f6fed; --border:#dcdcd6; --me:#2f6fed; --other:#e9e9e4; }
  :root[data-theme="dark"] { --bg:#161615; --card:#222221; --text:#ecece8; --muted:#9a9a94; --accent:#5b8def; --border:#36362f; --me:#3a6fe0; --other:#32322e; color-scheme:dark; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme]) { --bg:#161615; --card:#222221; --text:#ecece8; --muted:#9a9a94; --accent:#5b8def; --border:#36362f; --me:#3a6fe0; --other:#32322e; color-scheme:dark; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,sans-serif; display:flex; justify-content:center; padding:16px; }
  main { width:100%; max-width:560px; }
  h1 { font-size:20px; margin:8px 0 16px; overflow-wrap:anywhere; }
  p.sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 14px; font:inherit; cursor:pointer; touch-action:manipulation; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
  button.live { background:#ef4444; color:#fff; border:1px solid transparent; }
  button:disabled { opacity:.5; cursor:default; }
  textarea, input[type=text] { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px; font:inherit; }
  textarea { height:90px; font-family:ui-monospace,monospace; font-size:16px; resize:vertical; }
  input[type=text] { font-size:16px; }
  .err { background:#fde8e8; color:#a12626; border-radius:8px; padding:8px 12px; margin-bottom:12px; font-size:14px; }
  :root[data-theme="dark"] .err { background:#3a1f1f; color:#ffb4b4; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme]) .err { background:#3a1f1f; color:#ffb4b4; } }
  label { display:block; font-size:14px; color:var(--muted); margin:12px 0 6px; }
  .hidden { display:none; }
  #status { font-size:14px; color:var(--muted); margin-bottom:4px; }
  #typingIndicator { font-size:12px; color:var(--muted); height:18px; margin-bottom:6px; font-style:italic; }
  #log { height:50vh; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding:4px; }
  #chat.withvideo #log { height:26vh; }
  .msg { max-width:85%; padding:8px 12px; border-radius:14px; word-wrap:break-word; white-space:pre-wrap; }
  .msg .who { font-size:11px; opacity:.75; margin-bottom:2px; }
  .msg.me { align-self:flex-end; background:var(--me); color:#fff; }
  .msg.other { align-self:flex-start; background:var(--other); }
  .msg.sys { align-self:center; color:var(--muted); font-size:13px; background:none; text-align:center; }
  .timer { font-size:10px; opacity:0.7; float:right; margin-left:8px; margin-top:2px; }
  code { background:rgba(255,255,255,0.1); padding:2px 4px; border-radius:4px; font-family:ui-monospace,monospace; }
  .settings-row { display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:14px; }
  .color-picker { display:flex; gap:6px; }
  .color-dot { width:24px; height:24px; border-radius:50%; border:2px solid transparent; cursor:pointer; }
  .color-dot.active { border-color:var(--text); }

  /* Voz e vídeo */
  .mediabar { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0; }
  .mediabar button { flex:1 1 0; min-width:130px; }
  #mediaStatus { font-size:13px; color:var(--muted); min-height:18px; margin-bottom:6px; }
  main.wide { max-width:1100px; }
  .stage { position:relative; width:100%; background:#000; border-radius:12px; overflow:hidden; margin:0 0 10px; display:flex; justify-content:center; align-items:center; }
  .stage video { display:block; width:100%; height:auto; max-height:72vh; object-fit:contain; background:#000; }
  .stage video.hidden { display:none; }
  .stage video.pip { position:absolute; right:8px; bottom:8px; width:26%; max-width:220px; height:auto; max-height:none; border-radius:8px; border:2px solid rgba(255,255,255,.6); }
  .stage .zoom { position:absolute; top:8px; right:8px; z-index:3; padding:6px 10px; font-size:13px; background:rgba(0,0,0,.55); color:#fff; border:1px solid rgba(255,255,255,.35); }
  .stage.full { position:fixed; top:0; left:0; right:0; bottom:0; z-index:100; width:auto; margin:0; border-radius:0; }
  .stage.full video { height:100%; max-height:100%; }
  .stage.full video.pip { height:auto; width:22%; max-width:240px; }
  body.noscroll { overflow:hidden; }
  #localVideo { transform:scaleX(-1); }
  #localVideo.nomirror { transform:none; }
  #netStatus { font-size:12px; color:var(--muted); min-height:16px; margin-bottom:6px; }
</style>
</head>
<body>
<main id="app">
  <h1 id="title">Chat</h1>

  <div id="boot" class="err">O JavaScript não está rodando neste visualizador, então os botões não funcionam.</div>
  <div id="err" class="err hidden" role="alert"></div>

  <section id="start" class="card">
    <label for="myName" style="margin-top:0">Seu nome nesta conversa</label>
    <input id="myName" type="text" maxlength="24" placeholder="Ex.: Ana" autocomplete="off">

    <div class="settings-row">
      <span>Tema Visual:</span>
      <select id="themeSelect" style="width:auto; padding:4px 8px;">
        <option value="dark" selected>Escuro</option>
        <option value="light">Claro</option>
        <option value="auto">Automático do Sistema</option>
      </select>
    </div>

    <div class="settings-row">
      <span>Cor de Destaque:</span>
      <div class="color-picker">
        <div class="color-dot" style="background:#2f6fed;" data-color="#2f6fed"></div>
        <div class="color-dot" style="background:#10b981;" data-color="#10b981"></div>
        <div class="color-dot" style="background:#8b5cf6;" data-color="#8b5cf6"></div>
        <div class="color-dot" style="background:#f59e0b;" data-color="#f59e0b"></div>
        <div class="color-dot" style="background:#ef4444;" data-color="#ef4444"></div>
      </div>
    </div>

    <div class="row" style="margin-top:16px">
      <button id="btnHost" type="button">Iniciar conversa</button>
      <button id="btnJoin" type="button" class="ghost">Tenho um código</button>
    </div>
  </section>

  <section id="hostBox" class="card hidden">
    <b>1.</b> Envie este código para a outra pessoa:
    <label>Seu código</label>
    <textarea id="offerOut" readonly></textarea>
    <div class="row"><button id="copyOffer" type="button" class="ghost">Copiar</button></div>
    <label><b>2.</b> Cole aqui o código de resposta:</label>
    <textarea id="answerIn" placeholder="Cole a resposta aqui"></textarea>
    <div class="row" style="margin-top:8px"><button id="btnConnect" type="button">Conectar</button></div>
  </section>

  <section id="joinBox" class="card hidden">
    <b>1.</b> Cole o código que você recebeu:
    <textarea id="offerIn" placeholder="Cole o código aqui"></textarea>
    <div class="row" style="margin-top:8px"><button id="btnAnswer" type="button">Gerar resposta</button></div>
    <div id="invite" class="hidden" style="margin-top:8px"></div>
    <div id="answerWrap" class="hidden">
      <label><b>2.</b> Envie este código de volta:</label>
      <textarea id="answerOut" readonly></textarea>
      <div class="row"><button id="copyAnswer" type="button" class="ghost">Copiar</button></div>
    </div>
  </section>

  <section id="chat" class="card hidden">
    <div id="status">Conectando…</div>

    <div class="mediabar">
      <button id="btnVoice" type="button" class="ghost">Ligar voz</button>
      <button id="btnVideo" type="button" class="ghost">Ligar câmera</button>
      <button id="btnScreen" type="button" class="ghost">Compartilhar tela</button>
    </div>
    <div id="mediaStatus"></div>
    <div id="netStatus"></div>
    <div class="row" style="margin-bottom:6px"><button id="soundBtn" type="button" class="ghost hidden">Toque para ativar o som</button></div>
    <div id="stage" class="stage hidden">
      <video id="remoteVideo" autoplay playsinline muted></video>
      <video id="localVideo" autoplay playsinline muted></video>
      <button id="btnZoom" type="button" class="zoom">Ampliar</button>
    </div>
    <audio id="remoteAudio" autoplay></audio>

    <div id="typingIndicator"></div>
    <div id="log"></div>
    <div class="row" style="margin-top:10px; flex-wrap:nowrap">
      <input id="text" type="text" placeholder="Digite uma mensagem (suporta **negrito**, *itálico*, `código`)" autocomplete="off" enterkeyhint="send">
      <button id="btnSend" type="button">Enviar</button>
    </div>
    <div class="row" style="margin-top:10px"><button id="btnEnd" type="button" class="ghost">Encerrar e apagar tudo</button></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const bootEl = $('boot');
if (bootEl) bootEl.classList.add('hidden');

if (typeof RTCPeerConnection === 'undefined') {
  const errEl = $('err');
  if (errEl) {
    errEl.textContent = 'Este navegador não suporta WebRTC.';
    errEl.classList.remove('hidden');
  }
}

const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
let pc = null, dc = null;
let myName = '', peerName = '';
let localKeypair = null, sharedKey = null;
let typingTimeout = null;

// Negociação de mídia pelo canal de dados (quem entra é o lado "educado" em caso de conflito)
let polite = false, makingOffer = false, ignoreOffer = false;
let signalChain = Promise.resolve();
const media = {
  audio: { tx: null, track: null, busy: false },
  video: { tx: null, track: null, busy: false, source: null }
};
let peerAudio = false, peerVideo = false, peerScreen = false;
let remoteAudioStream = null, remoteVideoStream = null;
const dcOpen = () => !!dc && dc.readyState === 'open';

// --- Configurações Visuais e Temas ---
const rootEl = document.documentElement;
const themeSelect = $('themeSelect');
if (themeSelect) {
  themeSelect.onchange = (e) => {
    const val = e.target.value;
    if (val === 'auto') rootEl.removeAttribute('data-theme');
    else rootEl.setAttribute('data-theme', val);
  };
}

document.querySelectorAll('.color-dot').forEach(dot => {
  dot.onclick = (e) => {
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
    e.target.classList.add('active');
    const color = e.target.getAttribute('data-color');
    rootEl.style.setProperty('--accent', color);
    rootEl.style.setProperty('--me', color);
  };
});
const firstColorDot = document.querySelector('.color-dot');
if (firstColorDot) firstColorDot.classList.add('active');

// --- E2EE (Web Crypto API) ---
async function initCrypto() {
  try {
    localKeypair = await window.crypto.subtle.generateKey(
      { name: "ECDH", namedCurve: "P-256" },
      false,
      ["deriveKey", "deriveBits"]
    );
  } catch (err) {
    console.error("Erro ao gerar chaves criptográficas:", err);
  }
}
initCrypto();

async function exportPubKey(keypair) {
  const pubKeyBytes = await window.crypto.subtle.exportKey("spki", keypair.publicKey);
  return btoa(String.fromCharCode(...new Uint8Array(pubKeyBytes)));
}

async function importPubKey(b64PubKey) {
  const binary = atob(b64PubKey);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return await window.crypto.subtle.importKey(
    "spki",
    bytes.buffer,
    { name: "ECDH", namedCurve: "P-256" },
    false,
    []
  );
}

async function deriveSharedKey(remotePubKey) {
  sharedKey = await window.crypto.subtle.deriveKey(
    { name: "ECDH", public: remotePubKey },
    localKeypair.privateKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

async function encryptData(text) {
  if (!sharedKey) return new TextEncoder().encode(text);
  const iv = window.crypto.getRandomValues(new Uint8Array(12));
  const encoded = new TextEncoder().encode(text);
  const ciphertext = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv }, sharedKey, encoded);
  const combined = new Uint8Array(iv.byteLength + ciphertext.byteLength);
  combined.set(iv, 0);
  combined.set(new Uint8Array(ciphertext), iv.byteLength);
  return combined;
}

async function decryptData(buffer) {
  if (!sharedKey) return new TextDecoder().decode(buffer);
  const iv = buffer.slice(0, 12);
  const data = buffer.slice(12);
  const decrypted = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv }, sharedKey, data);
  return new TextDecoder().decode(decrypted);
}

// --- Funções de Som (Web Audio API) ---
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  } catch(_) {}
}

// --- Utilitários de codificação do canal ---
function toB64(s) { let r = ''; new TextEncoder().encode(s).forEach(x => r += String.fromCharCode(x)); return btoa(r); }
function fromB64(s) { return new TextDecoder().decode(Uint8Array.from(atob(s.trim()), c => c.charCodeAt(0))); }

async function getOfferPayload() {
  const pubKeyB64 = await exportPubKey(localKeypair);
  return toB64(JSON.stringify({ d: pc.localDescription, n: myName, k: pubKeyB64 }));
}

const cleanName = s => (s || '').replace(/\s+/g, ' ').trim().slice(0, 24);

function show(id) { ['start','hostBox','joinBox','chat'].forEach(x => $(x).classList.toggle('hidden', x !== id)); }
function warn(msg) {
  const e = $('err'); e.textContent = msg; e.classList.remove('hidden');
  setTimeout(() => e.classList.add('hidden'), 5000);
}

// --- Renderizador Markdown Simples ---
function escapeHTML(str) {
  return str.replace(/[&<>'"]/g,
    tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
  );
}

function parseMarkdown(text) {
  let safe = escapeHTML(text);
  safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
  safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  safe = safe.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  return safe;
}

function addMsg(text, who) {
  const el = document.createElement('div');
  el.className = 'msg ' + who;

  if (who === 'me' || who === 'other') {
    const w = document.createElement('div');
    w.className = 'who';
    w.textContent = who === 'me' ? myName : (peerName || 'Anônimo');
    el.appendChild(w);

    const content = document.createElement('div');
    content.innerHTML = parseMarkdown(text);
    el.appendChild(content);

    // Modo Destruição Automática (5 minutos)
    const timerEl = document.createElement('span');
    timerEl.className = 'timer';
    let timeLeft = 300;
    timerEl.textContent = '5:00';
    el.appendChild(timerEl);

    const interval = setInterval(() => {
      timeLeft--;
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      timerEl.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
      if (timeLeft <= 0) {
        clearInterval(interval);
        el.style.transition = 'opacity 0.5s';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 500);
      }
    }, 1000);

    if (who === 'other' && document.hidden) {
      playBeep();
    }
  } else {
    el.appendChild(document.createTextNode(text));
  }

  const logEl = $('log');
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
}

function updateTitle() {
  $('title').textContent = (myName && peerName) ? 'Chat entre ' + myName + ' e ' + peerName : 'Chat';
}

let announced = false;
function markConnected() {
  updateTitle();
  show('chat');
  startStats();
  $('status').textContent = 'Conectado com ' + (peerName || 'Anônimo') + ' (E2EE ativo)';
  if (!announced) { announced = true; addMsg('Você está conversando com ' + (peerName || 'Anônimo') + '.', 'sys'); }
}

// --- Voz e vídeo: sinalização pelo canal de dados (sem copiar códigos de novo) ---
function sendSignal(payload) {
  if (!dcOpen()) return;
  payload.type = 'rtc';
  dc.send(JSON.stringify(payload));
}

async function handleSignal(msg) {
  if (!pc) return;
  if (msg.description) {
    const d = msg.description;
    const collision = d.type === 'offer' && (makingOffer || pc.signalingState !== 'stable');
    ignoreOffer = !polite && collision;
    if (ignoreOffer) return;
    if (collision && pc.signalingState === 'have-local-offer') {
      await Promise.all([pc.setLocalDescription({ type: 'rollback' }), pc.setRemoteDescription(d)]);
    } else {
      await pc.setRemoteDescription(d);
    }
    if (d.type === 'offer') {
      await pc.setLocalDescription(await pc.createAnswer());
      sendSignal({ description: pc.localDescription });
    }
  } else if (msg.candidate) {
    try { await pc.addIceCandidate(msg.candidate); }
    catch (err) { if (!ignoreOffer) console.error(err); }
  }
}

function queueSignal(msg) {
  signalChain = signalChain.then(() => handleSignal(msg)).catch(err => console.error('Sinalização:', err));
}

function tryPlay(el) {
  const p = el.play();
  if (p && p.catch) p.catch(() => { $('soundBtn').classList.remove('hidden'); });
}

function attachRemote(track) {
  const isVideo = track.kind === 'video';
  if (isVideo) { if (!remoteVideoStream) remoteVideoStream = new MediaStream(); }
  else { if (!remoteAudioStream) remoteAudioStream = new MediaStream(); }
  const stream = isVideo ? remoteVideoStream : remoteAudioStream;
  if (stream.getTracks().indexOf(track) === -1) stream.addTrack(track);
  const el = isVideo ? $('remoteVideo') : $('remoteAudio');
  if (el.srcObject !== stream) el.srcObject = stream;
  if (isVideo) el.muted = true;
  tryPlay(el);
}

$('soundBtn').onclick = () => {
  [$('remoteAudio'), $('remoteVideo')].forEach(el => { const p = el.play(); if (p && p.catch) p.catch(() => {}); });
  $('soundBtn').classList.add('hidden');
};

function mediaErrorText(err, kind, source) {
  const name = err && err.name;
  if (source === 'screen') {
    if (name === 'NotAllowedError' || name === 'SecurityError') return 'Compartilhamento de tela cancelado ou negado.';
    if (name === 'NotSupportedError' || name === 'TypeError') return 'Este aparelho não permite compartilhar a tela.';
    return 'Não foi possível compartilhar a tela.';
  }
  const what = kind === 'audio' ? 'microfone' : 'câmera';
  if (name === 'NotAllowedError' || name === 'SecurityError') return 'Permissão negada para o ' + what + '. Libere o acesso nas configurações do navegador.';
  if (name === 'NotFoundError' || name === 'OverconstrainedError') return 'Nenhum ' + what + ' encontrado neste aparelho.' + (kind === 'video' ? ' Para mostrar a tela, use "Compartilhar tela".' : '');
  if (name === 'NotReadableError') return 'O ' + what + ' está em uso por outro app.';
  return 'Não foi possível ligar o ' + what + '.';
}

function sendMedia() {
  if (!dcOpen()) return;
  dc.send(JSON.stringify({ type: 'media', audio: !!media.audio.track, video: !!media.video.track, screen: media.video.source === 'screen' }));
}

function updateMediaUI() {
  const aOn = !!media.audio.track, vOn = !!media.video.track;
  const scrOn = vOn && media.video.source === 'screen', camOn = vOn && !scrOn;
  $('btnVoice').textContent = aOn ? 'Desligar voz' : 'Ligar voz';
  $('btnVoice').classList.toggle('live', aOn);
  $('btnVoice').classList.toggle('ghost', !aOn);
  $('btnVideo').textContent = camOn ? 'Desligar câmera' : 'Ligar câmera';
  $('btnVideo').classList.toggle('live', camOn);
  $('btnVideo').classList.toggle('ghost', !camOn);
  $('btnScreen').textContent = scrOn ? 'Parar de compartilhar' : 'Compartilhar tela';
  $('btnScreen').classList.toggle('live', scrOn);
  $('btnScreen').classList.toggle('ghost', !scrOn);

  const showStage = vOn || peerVideo;
  $('stage').classList.toggle('hidden', !showStage);
  $('chat').classList.toggle('withvideo', showStage);
  $('remoteVideo').classList.toggle('hidden', !peerVideo);
  $('localVideo').classList.toggle('hidden', !vOn);
  $('localVideo').classList.toggle('pip', vOn && peerVideo);
  $('localVideo').classList.toggle('nomirror', scrOn);
  $('app').classList.toggle('wide', showStage);   // com vídeo, a página usa a largura do computador
  if (!showStage) setZoom(false);

  const who = peerName || 'A outra pessoa';
  const parts = [];
  if (peerAudio) parts.push('com a voz ligada');
  if (peerVideo) parts.push(peerScreen ? 'compartilhando a tela' : 'com a câmera ligada');
  $('mediaStatus').textContent = parts.length ? who + ' está ' + parts.join(' e ') + '.' : '';
  if (!aOn && !vOn && !peerAudio && !peerVideo) $('netStatus').textContent = '';
}

async function startLocal(kind, source) {
  const m = media[kind];
  const md = navigator.mediaDevices;
  if (source === 'screen') {
    if (!md || !md.getDisplayMedia) {
      warn('Este aparelho não permite compartilhar a tela. No celular isso costuma não ser possível; use o computador.');
      return;
    }
  } else if (!md || !md.getUserMedia) {
    warn('Câmera e microfone só funcionam em página segura (HTTPS) e em navegador compatível.');
    return;
  }
  let stream;
  try {
    if (source === 'screen') {
      stream = await md.getDisplayMedia({ video: { frameRate: { ideal: 15, max: 30 }, width: { max: 1920 }, height: { max: 1080 } }, audio: false });
    } else if (kind === 'audio') {
      stream = await md.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
    } else {
      stream = await md.getUserMedia({ video: { facingMode: 'user', width: { ideal: 480 }, height: { ideal: 360 }, frameRate: { ideal: 24, max: 30 } } });
    }
  } catch (err) { warn(mediaErrorText(err, kind, source)); return; }

  const track = stream.getTracks()[0];
  const old = m.track;   // câmera <-> tela: troca a faixa sem renegociar
  if (old) { try { old.onended = null; old.stop(); } catch (_) {} }
  m.track = track;
  m.source = kind === 'video' ? (source || 'camera') : null;
  try { track.contentHint = kind === 'audio' ? 'speech' : (source === 'screen' ? 'detail' : 'motion'); } catch (_) {}
  track.onended = () => {
    if (m.track === track) { stopLocal(kind); sendMedia(); updateMediaUI(); }
  };
  if (kind === 'video') {
    const lv = $('localVideo');
    lv.muted = true;
    lv.srcObject = new MediaStream([track]);
    const p = lv.play(); if (p && p.catch) p.catch(() => {});
  }
  if (m.tx) {
    await m.tx.sender.replaceTrack(track);
    m.tx.direction = 'sendrecv';
  } else {
    m.tx = pc.addTransceiver(track, { direction: 'sendrecv' });
  }
  tuneAll();
}

function stopLocal(kind) {
  const m = media[kind];
  if (!m.track) return;
  const t = m.track;
  m.track = null;
  m.source = null;
  try { t.onended = null; t.stop(); } catch (_) {}
  if (kind === 'video') $('localVideo').srcObject = null;
  if (m.tx && pc && pc.signalingState !== 'closed') {
    m.tx.sender.replaceTrack(null).catch(() => {});
    try { m.tx.direction = 'recvonly'; } catch (_) {}
  }
}

async function toggleMedia(kind, source) {
  const m = media[kind];
  if (m.busy) return;
  if (!dcOpen()) { warn('Conecte-se primeiro.'); return; }
  m.busy = true;
  try {
    const same = m.track && (kind === 'audio' || m.source === (source || 'camera'));
    if (same) stopLocal(kind); else await startLocal(kind, source);
  } finally { m.busy = false; }
  sendMedia();
  updateMediaUI();
}

function teardownMedia() {
  stopLocal('audio');
  stopLocal('video');
  peerAudio = false;
  peerVideo = false;
  peerScreen = false;
  updateMediaUI();
}

$('btnVoice').onclick = () => toggleMedia('audio');
$('btnVideo').onclick = () => toggleMedia('video', 'camera');
$('btnScreen').onclick = () => toggleMedia('video', 'screen');

// Ampliar: o vídeo ocupa a janela inteira (tela cheia do navegador quando disponível)
function setZoom(on) {
  const st = $('stage');
  if (st.classList.contains('full') === on) return;
  st.classList.toggle('full', on);
  document.body.classList.toggle('noscroll', on);
  $('btnZoom').textContent = on ? 'Fechar' : 'Ampliar';
  try {
    if (on && st.requestFullscreen) { const p = st.requestFullscreen(); if (p && p.catch) p.catch(() => {}); }
    else if (!on && document.fullscreenElement && document.exitFullscreen) { const p = document.exitFullscreen(); if (p && p.catch) p.catch(() => {}); }
  } catch (_) {}
}
$('btnZoom').onclick = () => setZoom(!$('stage').classList.contains('full'));
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) setZoom(false); });

// Dá prioridade ao áudio e limita o vídeo, para a voz não travar quando a rede está apertada
function tuneAll() {
  ['audio', 'video'].forEach(kind => {
    const m = media[kind];
    if (!m.track || !m.tx || !m.tx.sender || !m.tx.sender.getParameters) return;
    try {
      const sender = m.tx.sender;
      const p = sender.getParameters();
      if (!p.encodings || !p.encodings.length) return;   // ainda não negociado: roda de novo ao ficar "stable"
      const e = p.encodings[0];
      if (kind === 'audio') {
        e.maxBitrate = 40000; e.priority = 'high'; e.networkPriority = 'high';
      } else {
        const screen = m.source === 'screen';
        e.maxBitrate = screen ? 2000000 : 500000;
        e.priority = 'low'; e.networkPriority = 'low';
        if (screen) e.maxFramerate = 15;
      }
      const r = sender.setParameters(p);
      if (r && r.catch) r.catch(() => {});
    } catch (_) {}
  });
}

// Qualidade da rede durante a chamada (atraso, perda e variação do áudio recebido)
let statsTimer = null, lastNet = null;
function startStats() { if (!statsTimer) statsTimer = setInterval(pollStats, 2000); }
async function pollStats() {
  const active = media.audio.track || media.video.track || peerAudio || peerVideo;
  if (!pc || !active) return;
  try {
    const rep = await pc.getStats();
    let pairId = null, rtt = null, jit = null, lost = 0, recv = 0, hasAudioIn = false;
    rep.forEach(r => { if (r.type === 'transport' && r.selectedCandidatePairId) pairId = r.selectedCandidatePairId; });
    rep.forEach(r => {
      if (r.type === 'candidate-pair' && r.id === pairId && typeof r.currentRoundTripTime === 'number') rtt = r.currentRoundTripTime * 1000;
      if (r.type === 'inbound-rtp' && r.kind === 'audio') {
        hasAudioIn = true;
        lost = r.packetsLost || 0;
        recv = r.packetsReceived || 0;
        if (typeof r.jitter === 'number') jit = r.jitter * 1000;
      }
    });
    let loss = 0;
    if (lastNet && lost >= lastNet.lost && recv >= lastNet.recv) {
      const dl = lost - lastNet.lost, dr = recv - lastNet.recv;
      if (dl + dr > 0) loss = dl * 100 / (dl + dr);
    }
    lastNet = { lost: lost, recv: recv };
    const bits = [];
    if (rtt !== null) bits.push(Math.round(rtt) + ' ms de atraso');
    if (hasAudioIn) {
      bits.push(Math.round(loss) + '% de perda');
      if (jit !== null) bits.push(Math.round(jit) + ' ms de variação');
    }
    let txt = bits.length ? 'Rede: ' + bits.join(' · ') : '';
    if (txt && hasAudioIn && (loss >= 5 || (jit !== null && jit > 60) || (rtt !== null && rtt > 400))) txt += ' (conexão instável)';
    $('netStatus').textContent = txt;
  } catch (_) {}
}

function newPeer() {
  pc = new RTCPeerConnection(rtcConfig);
  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === 'connected') markConnected();
    if (s === 'failed') { $('status').textContent = 'Falha na conexão P2P direta.'; teardownMedia(); }
    if (s === 'disconnected' || s === 'closed') { $('status').textContent = 'Conexão encerrada'; addMsg((peerName || 'A outra pessoa') + ' saiu.', 'sys'); }
    if (s === 'closed') teardownMedia();
  };
  // Candidatos novos (se houver) seguem pelo canal de dados; no handshake inicial já vão dentro do código
  pc.onicecandidate = e => { if (e.candidate) sendSignal({ candidate: e.candidate }); };
  pc.ontrack = e => {
    const k = e.track.kind;
    if (media[k] && !media[k].tx) media[k].tx = e.transceiver;
    if (k === 'audio' && e.receiver) {
      // Buffer maior no recebimento: troca um pouco de atraso por áudio mais contínuo
      try {
        if ('jitterBufferTarget' in e.receiver) e.receiver.jitterBufferTarget = 250;
        else if ('playoutDelayHint' in e.receiver) e.receiver.playoutDelayHint = 0.25;
      } catch (_) {}
    }
    attachRemote(e.track);
  };
  pc.onsignalingstatechange = () => { if (pc.signalingState === 'stable') tuneAll(); };
  pc.onnegotiationneeded = async () => {
    if (!dcOpen()) return;   // o handshake inicial é manual (códigos)
    try {
      makingOffer = true;
      await pc.setLocalDescription(await pc.createOffer());
      sendSignal({ description: pc.localDescription });
    } catch (err) {
      // Conflito de ofertas simultâneas: esperado, a negociação é refeita quando o estado voltar a "stable"
      if (pc.signalingState === 'stable') console.error('Negociação:', err);
    } finally {
      makingOffer = false;
    }
  };
  return pc;
}

function setupChannel(ch) {
  dc = ch;
  dc.binaryType = 'arraybuffer';
  dc.onopen = markConnected;
  dc.onmessage = async e => {
    if (typeof e.data === 'string') {
      let obj;
      try { obj = JSON.parse(e.data); } catch (_) { return; }
      if (obj.type === 'typing') {
        $('typingIndicator').textContent = obj.val ? (peerName || 'O outro usuário') + ' está digitando...' : '';
      } else if (obj.type === 'media') {
        peerAudio = !!obj.audio;
        peerVideo = !!obj.video;
        peerScreen = !!obj.video && !!obj.screen;
        updateMediaUI();
      } else if (obj.type === 'rtc') {
        queueSignal(obj);
      }
    } else {
      try {
        const decrypted = await decryptData(e.data);
        addMsg(decrypted, 'other');
      } catch (_) {}
    }
  };
  dc.onclose = () => { $('status').textContent = 'Conexão encerrada'; teardownMedia(); };
}

function iceComplete() {
  return new Promise(res => {
    if (pc.iceGatheringState === 'complete') return res();
    const done = () => { if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', done); res(); } };
    pc.addEventListener('icegatheringstatechange', done);
    setTimeout(res, 5000);
  });
}

async function copy(id, btn) {
  try { await navigator.clipboard.writeText($(id).value); } catch (_) {$(id).select(); document.execCommand('copy'); }
  const t = btn.textContent; btn.textContent = 'Copiado!'; setTimeout(() => btn.textContent = t, 1200);
}

// --- Handlers de Conexão ---
$('btnHost').onclick = async () => {
  const n = cleanName($('myName').value);
  if (!n) { warn('Escolha um nome.'); $('myName').focus(); return; }
  myName = n;
  polite = false;
  show('hostBox');
  newPeer();
  setupChannel(pc.createDataChannel('chat'));
  await pc.setLocalDescription(await pc.createOffer());
  await iceComplete();
  $('offerOut').value = await getOfferPayload();
};

$('btnConnect').onclick = async () => {
  try {
    const raw = fromB64($('answerIn').value);
    const o = JSON.parse(raw);
    peerName = cleanName(o.n) || 'Anônimo';
    const remotePubKey = await importPubKey(o.k);
    await deriveSharedKey(remotePubKey);
    updateTitle();
    await pc.setRemoteDescription(o.d);
    $('btnConnect').disabled = true;
  } catch (_) { warn('Código de resposta inválido.'); }
};
$('copyOffer').onclick = e => copy('offerOut', e.target);

$('btnJoin').onclick = () => {
  const n = cleanName($('myName').value);
  if (!n) { warn('Escolha um nome.'); $('myName').focus(); return; }
  myName = n;
  polite = true;
  show('joinBox');
};

$('btnAnswer').onclick = async () => {
  try {
    const raw = fromB64($('offerIn').value);
    const o = JSON.parse(raw);
    peerName = cleanName(o.n) || 'Anônimo';
    const remotePubKey = await importPubKey(o.k);

    updateTitle();
    $('invite').textContent = 'Convite de ' + peerName;
    $('invite').classList.remove('hidden');

    newPeer();
    pc.ondatachannel = e => setupChannel(e.channel);
    await pc.setRemoteDescription(o.d);
    await deriveSharedKey(remotePubKey);

    await pc.setLocalDescription(await pc.createAnswer());
    await iceComplete();

    const localPubKeyB64 = await exportPubKey(localKeypair);
    $('answerOut').value = toB64(JSON.stringify({ d: pc.localDescription, n: myName, k: localPubKeyB64 }));
    $('answerWrap').classList.remove('hidden');
  } catch (_) { warn('Código inválido.'); }
};
$('copyAnswer').onclick = e => copy('answerOut', e.target);

// --- Envio de Mensagens e Indicador de Digitação ---
async function sendMsg() {
  const t = $('text').value.trim();
  if (!t) return;
  if (!dc || dc.readyState !== 'open') { addMsg('Não conectado.', 'sys'); return; }

  const encrypted = await encryptData(t);
  dc.send(encrypted);
  addMsg(t, 'me');
  $('text').value = '';

  if (dc.readyState === 'open') {
    dc.send(JSON.stringify({ type: 'typing', val: false }));
  }
}

const textInput = $('text');
textInput.addEventListener('input', () => {
  if (!dc || dc.readyState !== 'open') return;
  dc.send(JSON.stringify({ type: 'typing', val: true }));
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => {
    if (dc && dc.readyState === 'open') {
      dc.send(JSON.stringify({ type: 'typing', val: false }));
    }
  }, 1500);
});

$('btnSend').onclick = sendMsg;
textInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMsg(); }
});
$('btnEnd').onclick = () => { try { teardownMedia(); dc && dc.close(); pc && pc.close(); } catch (_) {} location.reload(); };
window.addEventListener('beforeunload', () => { try { pc && pc.close(); } catch (_) {} });
</script>
