<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chat P2P</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --text:#1c1c1a; --muted:#6b6b66; --accent:#2f6fed; --border:#dcdcd6; --me:#2f6fed; --other:#e9e9e4; }
  :root[data-theme="dark"] { --bg:#161615; --card:#222221; --text:#ecece8; --muted:#9a9a94; --accent:#5b8def; --border:#36362f; --me:#3a6fe0; --other:#32322e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:16px/1.45 system-ui,sans-serif; display:flex; justify-content:center; padding:16px; }
  main { width:100%; max-width:560px; }
  h1 { font-size:20px; margin:8px 0 16px; overflow-wrap:anywhere; }
  p.sub { color:var(--muted); margin:0 0 16px; font-size:14px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 14px; font:inherit; cursor:pointer; touch-action:manipulation; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
  button:disabled { opacity:.5; cursor:default; }
  textarea, input[type=text] { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:10px; font:inherit; }
  textarea { height:90px; font-family:ui-monospace,monospace; font-size:16px; resize:vertical; }
  input[type=text] { font-size:16px; }
  .err { background:#fde8e8; color:#a12626; border-radius:8px; padding:8px 12px; margin-bottom:12px; font-size:14px; }
  :root[data-theme="dark"] .err { background:#3a1f1f; color:#ffb4b4; }
  label { display:block; font-size:14px; color:var(--muted); margin:12px 0 6px; }
  .hidden { display:none; }
  #status { font-size:14px; color:var(--muted); margin-bottom:4px; }
  #typingIndicator { font-size:12px; color:var(--muted); height:18px; margin-bottom:6px; font-style:italic; }
  #log { height:50vh; overflow-y:auto; display:flex; flex-direction:column; gap:6px; padding:4px; }
  .msg { max-width:85%; padding:8px 12px; border-radius:14px; word-wrap:break-word; white-space:pre-wrap; }
  .msg .who { font-size:11px; opacity:.75; margin-bottom:2px; }
  .msg.me { align-self:flex-end; background:var(--me); color:#fff; }
  .msg.other { align-self:flex-start; background:var(--other); }
  .msg.sys { align-self:center; color:var(--muted); font-size:13px; background:none; text-align:center; }
  .timer { font-size:10px; opacity:0.7; float:right; margin-left:8px; margin-top:2px; }
  .og-card { border:1px solid var(--border); border-radius:8px; padding:8px; margin-top:8px; background:rgba(0,0,0,0.05); display:flex; gap:8px; text-decoration:none; color:inherit; }
  .og-card img { width:60px; height:60px; object-fit:cover; border-radius:4px; flex-shrink:0; }
  .og-info { overflow:hidden; font-size:13px; }
  .og-title { font-weight:bold; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .og-desc { font-size:11px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  code { background:rgba(255,255,255,0.1); padding:2px 4px; border-radius:4px; font-family:ui-monospace,monospace; }
  .settings-row { display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:14px; }
  .color-picker { display:flex; gap:6px; }
  .color-dot { width:24px; height:24px; border-radius:50%; border:2px solid transparent; cursor:pointer; }
  .color-dot.active { border-color:var(--text); }
</style>
</head>
<body>
<main>
  <h1 id="title">Chat</h1>

  <div id="boot" class="err">O JavaScript não está rodando neste visualizador, então os botões não funcionam.</div>
  <div id="err" class="err hidden" role="alert"></div>

  <section id="start" class="card">
    <label for="myName" style="margin-top:0">Seu nome nesta conversa</label>
    <input id="myName" type="text" maxlength="24" placeholder="Ex.: Ana" autocomplete="off">
    
    <div class="settings-row">
      <span>Tema Visual:</span>
      <select id="themeSelect" style="width:auto; padding:4px 8px;">
        <option value="dark" selected>Escuro</option>
        <option value="light">Claro</option>
        <option value="auto">Automático do Sistema</option>
      </select>
    </div>

    <div class="settings-row">
      <span>Cor de Destaque:</span>
      <div class="color-picker">
        <div class="color-dot" style="background:#2f6fed;" data-color="#2f6fed"></div>
        <div class="color-dot" style="background:#10b981;" data-color="#10b981"></div>
        <div class="color-dot" style="background:#8b5cf6;" data-color="#8b5cf6"></div>
        <div class="color-dot" style="background:#f59e0b;" data-color="#f59e0b"></div>
        <div class="color-dot" style="background:#ef4444;" data-color="#ef4444"></div>
      </div>
    </div>

    <div class="row" style="margin-top:16px">
      <button id="btnHost" type="button">Iniciar conversa</button>
      <button id="btnJoin" type="button" class="ghost">Tenho um código</button>
    </div>
  </section>

  <section id="hostBox" class="card hidden">
    <b>1.</b> Envie este código para a outra pessoa:
    <label>Seu código</label>
    <textarea id="offerOut" readonly></textarea>
    <div class="row"><button id="copyOffer" type="button" class="ghost">Copiar</button></div>
    <label><b>2.</b> Cole aqui o código de resposta:</label>
    <textarea id="answerIn" placeholder="Cole a resposta aqui"></textarea>
    <div class="row" style="margin-top:8px"><button id="btnConnect" type="button">Conectar</button></div>
  </section>

  <section id="joinBox" class="card hidden">
    <b>1.</b> Cole o código que você recebeu:
    <textarea id="offerIn" placeholder="Cole o código aqui"></textarea>
    <div class="row" style="margin-top:8px"><button id="btnAnswer" type="button">Gerar resposta</button></div>
    <div id="invite" class="hidden" style="margin-top:8px"></div>
    <div id="answerWrap" class="hidden">
      <label><b>2.</b> Envie este código de volta:</label>
      <textarea id="answerOut" readonly></textarea>
      <div class="row"><button id="copyAnswer" type="button" class="ghost">Copiar</button></div>
    </div>
  </section>

  <section id="chat" class="card hidden">
    <div id="status">Conectando…</div>
    <div id="typingIndicator"></div>
    <div id="log"></div>
    <div class="row" style="margin-top:10px; flex-wrap:nowrap">
      <input id="text" type="text" placeholder="Digite uma mensagem (suporta **negrito**, *itálico*, `código`)" autocomplete="off" enterkeyhint="send">
      <button id="btnSend" type="button">Enviar</button>
    </div>
    <div class="row" style="margin-top:10px"><button id="btnEnd" type="button" class="ghost">Encerrar e apagar tudo</button></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const bootEl = $('boot');
if (bootEl) bootEl.classList.add('hidden');

if (typeof RTCPeerConnection === 'undefined') {
  const errEl = $('err');
  if (errEl) {
    errEl.textContent = 'Este navegador não suporta WebRTC.';
    errEl.classList.remove('hidden');
  }
}

const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
let pc = null, dc = null;
let myName = '', peerName = '';
let localKeypair = null, sharedKey = null;
let typingTimeout = null;

// --- Configurações Visuais e Temas ---
const rootEl = document.documentElement;
const themeSelect = $('themeSelect');
if (themeSelect) {
  themeSelect.onchange = (e) => {
    const val = e.target.value;
    if (val === 'auto') rootEl.removeAttribute('data-theme');
    else rootEl.setAttribute('data-theme', val);
  };
}

document.querySelectorAll('.color-dot').forEach(dot => {
  dot.onclick = (e) => {
    document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));
    e.target.classList.add('active');
    const color = e.target.getAttribute('data-color');
    rootEl.style.setProperty('--accent', color);
    rootEl.style.setProperty('--me', color);
  };
});
const firstColorDot = document.querySelector('.color-dot');
if (firstColorDot) firstColorDot.classList.add('active');

// --- E2EE (Web Crypto API) ---
async function initCrypto() {
  try {
    localKeypair = await window.crypto.subtle.generateKey(
      { name: "ECDH", namedCurve: "P-256" },
      false,
      ["deriveKey", "deriveBits"]
    );
  } catch (err) {
    console.error("Erro ao gerar chaves criptográficas:", err);
  }
}
initCrypto();

async function exportPubKey(keypair) {
  const pubKeyBytes = await window.crypto.subtle.exportKey("spki", keypair.publicKey);
  return btoa(String.fromCharCode(...new Uint8Array(pubKeyBytes)));
}

async function importPubKey(b64PubKey) {
  const binary = atob(b64PubKey);
  const bytes = Uint8Array.from(binary, c => c.charCodeAt(0));
  return await window.crypto.subtle.importKey(
    "spki",
    bytes.buffer,
    { name: "ECDH", namedCurve: "P-256" },
    false,
    []
  );
}

async function deriveSharedKey(remotePubKey) {
  sharedKey = await window.crypto.subtle.deriveKey(
    { name: "ECDH", public: remotePubKey },
    localKeypair.privateKey,
    { name: "AES-GCM", length: 256 },
    false,
    ["encrypt", "decrypt"]
  );
}

async function encryptData(text) {
  if (!sharedKey) return new TextEncoder().encode(text);
  const iv = window.crypto.getRandomValues(new Uint8Array(12));
  const encoded = new TextEncoder().encode(text);
  const ciphertext = await window.crypto.subtle.encrypt({ name: "AES-GCM", iv }, sharedKey, encoded);
  const combined = new Uint8Array(iv.byteLength + ciphertext.byteLength);
  combined.set(iv, 0);
  combined.set(new Uint8Array(ciphertext), iv.byteLength);
  return combined;
}

async function decryptData(buffer) {
  if (!sharedKey) return new TextDecoder().decode(buffer);
  const iv = buffer.slice(0, 12);
  const data = buffer.slice(12);
  const decrypted = await window.crypto.subtle.decrypt({ name: "AES-GCM", iv }, sharedKey, data);
  return new TextDecoder().decode(decrypted);
}

// --- Funções de Som (Web Audio API) ---
function playBeep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, ctx.currentTime);
    gain.gain.setValueAtTime(0.1, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  } catch(_) {}
}

// --- Utilitários de codificação do canal ---
function toB64(s) { let r = ''; new TextEncoder().encode(s).forEach(x => r += String.fromCharCode(x)); return btoa(r); }
function fromB64(s) { return new TextDecoder().decode(Uint8Array.from(atob(s.trim()), c => c.charCodeAt(0))); }

async function getOfferPayload() {
  const pubKeyB64 = await exportPubKey(localKeypair);
  return toB64(JSON.stringify({ d: pc.localDescription, n: myName, k: pubKeyB64 }));
}

const cleanName = s => (s || '').replace(/\s+/g, ' ').trim().slice(0, 24);

function show(id) { ['start','hostBox','joinBox','chat'].forEach(x => $(x).classList.toggle('hidden', x !== id)); }
function warn(msg) {
  const e = $('err'); e.textContent = msg; e.classList.remove('hidden');
  setTimeout(() => e.classList.add('hidden'), 4000);
}

// --- Renderizador Markdown Simples ---
function escapeHTML(str) {
  return str.replace(/[&<>'"]/g, 
    tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
  );
}

function parseMarkdown(text) {
  let safe = escapeHTML(text);
  safe = safe.replace(/`([^`]+)`/g, '<code>$1</code>');
  safe = safe.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  safe = safe.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  return safe;
}

// --- Pré-visualização de Links (Open Graph Otimizado com Fallback) ---
async function checkAndRenderLinks(text, msgEl) {
  const urlRegex = /(https?:\/\/[^\s]+)/g;
  const match = text.match(urlRegex);
  if (!match) return;
  const url = match[0];
  
  const card = document.createElement('a');
  card.className = 'og-card';
  card.href = url;
  card.target = '_blank';
  card.innerHTML = '<div class="og-info"><div class="og-title">Buscando prévia...</div><div class="og-desc">' + escapeHTML(url) + '</div></div>';
  msgEl.appendChild(card);

  try {
    // Usando api.microlink.io com tratamento correto de falha CORS / timeout
    const controller = new AbortController();
    const timeoutId = setTimeout(() => controller.abort(), 4000);
    
    const res = await fetch(`https://api.microlink.io?url=${encodeURIComponent(url)}`, { signal: controller.signal });
    clearTimeout(timeoutId);
    
    const json = await res.json();
    if (json.status === 'success' && json.data) {
      const { title, description, image } = json.data;
      let imgTag = image && image.url ? `<img src="${escapeHTML(image.url)}" alt="Capa">` : '';
      card.innerHTML = imgTag + `<div class="og-info"><div class="og-title">${escapeHTML(title || url)}</div><div class="og-desc">${escapeHTML(description || url)}</div></div>`;
    } else {
      throw new Error('Falha nos metadados');
    }
  } catch(_) {
    // Fallback: se a API falhar, transforma o card num link limpo com o domínio principal
    try {
      const parsedUrl = new URL(url);
      card.innerHTML = `<div class="og-info"><div class="og-title">${escapeHTML(parsedUrl.hostname)}</div><div class="og-desc">${escapeHTML(url)}</div></div>`;
    } catch(e) {
      card.remove();
    }
  }
}

function addMsg(text, who) {
  const el = document.createElement('div');
  el.className = 'msg ' + who;
  
  if (who === 'me' || who === 'other') {
    const w = document.createElement('div');
    w.className = 'who';
    w.textContent = who === 'me' ? myName : (peerName || 'Anônimo');
    el.appendChild(w);
    
    const content = document.createElement('div');
    content.innerHTML = parseMarkdown(text);
    el.appendChild(content);

    checkAndRenderLinks(text, el);

    // Modo Destruição Automática (5 minutos)
    const timerEl = document.createElement('span');
    timerEl.className = 'timer';
    let timeLeft = 300;
    timerEl.textContent = '5:00';
    el.appendChild(timerEl);

    const interval = setInterval(() => {
      timeLeft--;
      const m = Math.floor(timeLeft / 60);
      const s = timeLeft % 60;
      timerEl.textContent = `${m}:${s < 10 ? '0' : ''}${s}`;
      if (timeLeft <= 0) {
        clearInterval(interval);
        el.style.transition = 'opacity 0.5s';
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 500);
      }
    }, 1000);

    if (who === 'other' && document.hidden) {
      playBeep();
    }
  } else {
    el.appendChild(document.createTextNode(text));
  }

  const logEl = $('log');
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
}

function updateTitle() {
  $('title').textContent = (myName && peerName) ? 'Chat entre ' + myName + ' e ' + peerName : 'Chat';
}

let announced = false;
function markConnected() {
  updateTitle();
  show('chat');
  $('status').textContent = 'Conectado com ' + (peerName || 'Anônimo') + ' (E2EE ativo)';
  if (!announced) { announced = true; addMsg('Você está conversando com ' + (peerName || 'Anônimo') + '.', 'sys'); }
}

function newPeer() {
  pc = new RTCPeerConnection(rtcConfig);
  pc.onconnectionstatechange = () => {
    const s = pc.connectionState;
    if (s === 'connected') markConnected();
    if (s === 'failed') $('status').textContent = 'Falha na conexão P2P direta.';
    if (s === 'disconnected' || s === 'closed') { $('status').textContent = 'Conexão encerrada'; addMsg((peerName || 'A outra pessoa') + ' saiu.', 'sys'); }
  };
  return pc;
}

function setupChannel(ch) {
  dc = ch;
  dc.binaryType = 'arraybuffer';
  dc.onopen = markConnected;
  dc.onmessage = async e => {
    if (typeof e.data === 'string') {
      try {
        const obj = JSON.parse(e.data);
        if (obj.type === 'typing') {
          $('typingIndicator').textContent = obj.val ? (peerName || 'O outro usuário') + ' está digitando...' : '';
        }
      } catch(_) {}
    } else {
      const decrypted = await decryptData(e.data);
      addMsg(decrypted, 'other');
    }
  };
  dc.onclose = () => { $('status').textContent = 'Conexão encerrada'; };
}

function iceComplete() {
  return new Promise(res => {
    if (pc.iceGatheringState === 'complete') return res();
    const done = () => { if (pc.iceGatheringState === 'complete') { pc.removeEventListener('icegatheringstatechange', done); res(); } };
    pc.addEventListener('icegatheringstatechange', done);
    setTimeout(res, 5000);
  });
}

async function copy(id, btn) {
  try { await navigator.clipboard.writeText($(id).value); } catch (_) {$(id).select(); document.execCommand('copy'); }
  const t = btn.textContent; btn.textContent = 'Copiado!'; setTimeout(() => btn.textContent = t, 1200);
}

// --- Handlers de Conexão ---
$('btnHost').onclick = async () => {
  const n = cleanName($('myName').value);
  if (!n) { warn('Escolha um nome.'); $('myName').focus(); return; }
  myName = n;
  show('hostBox');
  newPeer();
  setupChannel(pc.createDataChannel('chat'));
  await pc.setLocalDescription(await pc.createOffer());
  await iceComplete();
  $('offerOut').value = await getOfferPayload();
};

$('btnConnect').onclick = async () => {
  try {
    const raw = fromB64($('answerIn').value);
    const o = JSON.parse(raw);
    peerName = cleanName(o.n) || 'Anônimo';
    const remotePubKey = await importPubKey(o.k);
    await deriveSharedKey(remotePubKey);
    updateTitle();
    await pc.setRemoteDescription(o.d);
    $('btnConnect').disabled = true;
  } catch (_) { warn('Código de resposta inválido.'); }
};
$('copyOffer').onclick = e => copy('offerOut', e.target);

$('btnJoin').onclick = () => {
  const n = cleanName($('myName').value);
  if (!n) { warn('Escolha um nome.'); $('myName').focus(); return; }
  myName = n;
  show('joinBox');
};

$('btnAnswer').onclick = async () => {
  try {
    const raw = fromB64($('offerIn').value);
    const o = JSON.parse(raw);
    peerName = cleanName(o.n) || 'Anônimo';
    const remotePubKey = await importPubKey(o.k);
    
    updateTitle();
    $('invite').textContent = 'Convite de ' + peerName;
    $('invite').classList.remove('hidden');
    
    newPeer();
    pc.ondatachannel = e => setupChannel(e.channel);
    await pc.setRemoteDescription(o.d);
    await deriveSharedKey(remotePubKey);

    await pc.setLocalDescription(await pc.createAnswer());
    await iceComplete();
    
    const localPubKeyB64 = await exportPubKey(localKeypair);
    $('answerOut').value = toB64(JSON.stringify({ d: pc.localDescription, n: myName, k: localPubKeyB64 }));$('answerWrap').classList.remove('hidden');
  } catch (_) { warn('Código inválido.'); }
};
$('copyAnswer').onclick = e => copy('answerOut', e.target);

// --- Envio de Mensagens e Indicador de Digitação ---
async function sendMsg() {
  const t = $('text').value.trim();
  if (!t) return;
  if (!dc || dc.readyState !== 'open') { addMsg('Não conectado.', 'sys'); return; }
  
  const encrypted = await encryptData(t);
  dc.send(encrypted);
  addMsg(t, 'me');
  $('text').value = '';
  
  if (dc.readyState === 'open') {
    dc.send(JSON.stringify({ type: 'typing', val: false }));
  }
}

const textInput = $('text');
textInput.addEventListener('input', () => {
  if (!dc || dc.readyState !== 'open') return;
  dc.send(JSON.stringify({ type: 'typing', val: true }));
  clearTimeout(typingTimeout);
  typingTimeout = setTimeout(() => {
    if (dc && dc.readyState === 'open') {
      dc.send(JSON.stringify({ type: 'typing', val: false }));
    }
  }, 1500);
});

$('btnSend').onclick = sendMsg;
textInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMsg(); }
});
$('btnEnd').onclick = () => { try { dc && dc.close(); pc && pc.close(); } catch (_) {} location.reload(); };
window.addEventListener('beforeunload', () => { try { pc && pc.close(); } catch (_) {} });
</script>
</body>
</html>
